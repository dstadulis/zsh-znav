name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  verify:
    name: Zsh, Conformance & Formal Proof Verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Zsh, Z3 CLI & UTF-8 locales (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh z3 locales
          sudo locale-gen en_US.UTF-8
          sudo update-locale
          locale -a | grep -Ei '^(C|en_US)\.(UTF-8|utf8)$'

      - name: Verify UTF-8 locale availability (macOS)
        if: runner.os == 'macOS'
        run: |
          locale -a | grep -Fx 'en_US.UTF-8'

      - name: Install Python verification dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install z3-solver pyyaml

      - name: Ensure Z3 CLI is available (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v z3 >/dev/null 2>&1; then
            Z3_PKG_BIN="$(python3 -c 'import pathlib, z3; p = pathlib.Path(z3.__file__).resolve().parent / "bin"; print(p)' 2>/dev/null || true)"
            if [ -n "${Z3_PKG_BIN}" ] && [ -x "${Z3_PKG_BIN}/z3" ]; then
              echo "${Z3_PKG_BIN}" >> "$GITHUB_PATH"
            else
              HOMEBREW_NO_AUTO_UPDATE=1 brew install z3
            fi
          fi

      - name: Run adversarial Zsh verification suite
        run: zsh tests/run_tests.zsh

      - name: Run 600+ op differential trace conformance
        run: python3 -B tests/diff_conformance.py

      - name: Run machine-checked formal proofs (Z3 + LCF kernel)
        run: python3 -B proofs/verify_all.py

      - name: Run adversarial formal proof audit
        run: python3 -B tests/audit_proofs.py

      - name: Run XNU Mach kernel zero-fork proof (macOS)
        if: runner.os == 'macOS'
        run: python3 -B tests/verify_zero_fork.py

      - name: Verify live plugin inside Unicode directory (/tmp/ci_unicode_日本_東京/zsh-znav)
        run: |
          UTF8_LOC="en_US.UTF-8"
          if ! locale -a 2>/dev/null | grep -Fqx "en_US.UTF-8"; then
            if locale -a 2>/dev/null | grep -Fqx "en_US.utf8"; then
              UTF8_LOC="en_US.utf8"
            elif locale -a 2>/dev/null | grep -Fqx "C.UTF-8"; then
              UTF8_LOC="C.UTF-8"
            else
              UTF8_LOC="C.utf8"
            fi
          fi
          cleanup_ci_unicode() {
            rm -rf "/tmp/ci_unicode_日本_東京" "/tmp/ci_unicode_home"
          }
          trap cleanup_ci_unicode EXIT
          cleanup_ci_unicode
          mkdir -p "/tmp/ci_unicode_日本_東京/zsh-znav/functions" \
                   "/tmp/ci_unicode_日本_東京/zsh-znav/data" \
                   "/tmp/ci_unicode_home/日本/sub" \
                   "/tmp/ci_unicode_home/東京/日本" \
                   "/tmp/ci_unicode_home/한국" \
                   "/tmp/ci_unicode_home/di" \
                   "/tmp/ci_unicode_home/dir"
          cp znav.plugin.zsh zsh-znav.plugin.zsh "/tmp/ci_unicode_日本_東京/zsh-znav/"
          for fn in functions/*; do
            case "$fn" in
              *.zwc|*.zwc.old) continue ;;
            esac
            if [ -f "$fn" ]; then
              cp "$fn" "/tmp/ci_unicode_日本_東京/zsh-znav/functions/"
            fi
          done
          LC_ALL="$UTF8_LOC" LANG="$UTF8_LOC" \
          HOME="/tmp/ci_unicode_home" \
          ZNAV_DATA_DIR="/tmp/ci_unicode_日本_東京/zsh-znav/data" \
          TERM=dumb \
          zsh -dfi +Z +m -c '
            PROMPT="" RPROMPT="" PS1="" PS2=""
            setopt NO_PROMPT_SP warn_create_global
            zmodload zsh/system zsh/parameter
            source "/tmp/ci_unicode_日本_東京/zsh-znav/zsh-znav.plugin.zsh" || exit 11
            PATH=""
            integer orig_pid=${sysparams[pid]}
            znav seed "$HOME/東京" || exit 12
            repeat 2 { builtin cd -q /; cd "$HOME/日本" || exit 13; }
            local c_jp=${_ZNAV_DIR2CODE[${HOME:A}/日本]}
            [[ -n $c_jp && ${~:-~$c_jp} == "${HOME:A}/日本" && ~[$c_jp] == "${HOME:A}/日本" ]] || exit 14
            [[ ~[日本] == "${HOME:A}/日本" ]] || exit 15
            [[ ~[東京:日本] == "${HOME:A}/東京/日本" ]] || exit 16
            j 東京 日本 && [[ $PWD == "${HOME:A}/東京/日本" ]] || exit 17
            j "$c_jp" sub && [[ $PWD == "${HOME:A}/日本/sub" ]] || exit 18
            znav list >/dev/null && znav explain "${HOME:A}/日本" >/dev/null && znav stats >/dev/null || exit 19
            (( ${#_ZNAV_DIR2CODE} == ${#_ZNAV_CODE2DIR} && ${#_ZNAV_DIR2CODE} == ${#_ZNAV_SCORE} )) || exit 20
            znav compact && znav compile || exit 21
            (( ZSH_SUBSHELL == 0 && sysparams[pid] == orig_pid )) || exit 22
          '
          cleanup_ci_unicode
          trap - EXIT

      - name: Ensure working tree stays clean
        run: test -z "$(git status --porcelain)"
